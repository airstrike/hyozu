[package]
name = "hyozu"
version = "0.3.0"
edition = "2024"

[dependencies]
iced_core = "0.15.0-dev"
iced_widget = { version = "0.15.0-dev", features = ["canvas"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
tatami = { git = "https://github.com/airstrike/tatami", branch = "master", optional = true }

[features]
advanced = []
geojson = ["dep:serde", "dep:serde_json"]
# Enables the `hyozu::tatami` adapter module — converters from tatami OLAP
# cube query results into hyozu marks and iced widgets. Pull in with
# `hyozu = { ..., features = ["tatami"] }` from downstream dashboards.
tatami = ["dep:tatami"]

[dev-dependencies]
iced = { version = "0.15.0-dev", features = ["debug", "tokio"] }
fount = { git = "https://github.com/airstrike/fount" }

[workspace]
members = ["examples/*"]

[patch.crates-io]
iced = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_core = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_graphics = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_runtime = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
iced_widget = { git = "https://github.com/airstrike/iced.git", branch = "dev" }
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "dev" }
