[package]
name = "hyozu"
version = "0.2.0"
edition = "2024"

[dependencies]
iced_core = "0.15.0-dev"
iced_widget = { version = "0.15.0-dev", features = ["canvas"] }
jiff = "0.2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

[features]
geojson = ["dep:serde", "dep:serde_json"]

[dev-dependencies]
iced = { version = "0.15.0-dev", features = ["debug", "tokio"] }
fount = { git = "https://github.com/airstrike/fount" }

[workspace]
members = ["examples/*"]

[patch.crates-io]
iced = { path = "../iced" }
iced_core = { path = "../iced/core" }
iced_graphics = { path = "../iced/graphics" }
iced_runtime = { path = "../iced/runtime" }
iced_widget = { path = "../iced/widget" }
cosmic-text = { git = "https://github.com/airstrike/cosmic-text", branch = "dev" }
