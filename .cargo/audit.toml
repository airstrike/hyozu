[advisories]
ignore = [
    # quick-xml < 0.41 pulled in by wayland-scanner (build-time codegen for
    # winit's wayland backend). No wayland-scanner release depends on
    # quick-xml >= 0.41 yet; drop these once one exists.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # drill_down's Polars 0.51 requires skiplist ^0.6; the fixes need 1.3.
    # Not a dependency of the hyozu library or icedcn browser. Polars' only
    # use is rolling/window.rs with Copy numeric values and TotalOrd::tot_cmp:
    # no panicking Drop (0300), no stateful comparator (0409).
    # Remove when Polars/tatami-inmem can use skiplist >= 1.3.
    "RUSTSEC-2026-0300",
    "RUSTSEC-2026-0409",
]
